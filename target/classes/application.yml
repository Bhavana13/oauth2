spring:
  application:
    name: oauth2
#  security:
#    oauth2:
#      client:
#        registration:
#          google:
#            client-id: YOUR_CLIENT_ID
#            client-secret: YOUR_CLIENT_SECRET
#            scope: profile, email
  security:
    oauth2:
      client:
        registration:
          github:
            client-id: ${oauth.client.id}
            client-secret: ${oauth.client.secret}
            scope: read:user, user:email  # Scopes to access user's profile and email
            authorization-grant-type: authorization_code  # Standard OAuth2 Authorization Code flow
            redirect-uri: "http://localhost:8080/login/oauth2/code/github"  # Define the redirect URI after successful login
            client-name: GitHub
        provider:
          github:
            authorization-uri: https://github.com/login/oauth/authorize
            token-uri: https://github.com/login/oauth/access_token
            user-info-uri: https://api.github.com/user
            user-name-attribute: login

logging:
  config: classpath:logback-spring.xml
